<main class="login-page d-flex align-items-center justify-content-center px-3">
  <section class="card login-card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 text-center mb-4">IdentityHub</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched">
          <div class="invalid-feedback" *ngIf="form.controls.email.hasError('required') && form.controls.email.touched">
            Email is required.
          </div>
          <div class="invalid-feedback" *ngIf="form.controls.email.hasError('email') && form.controls.email.touched">
            Enter a valid email.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched">
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <div class="alert alert-danger py-2" *ngIf="errorMessage" role="alert">
          {{ errorMessage }}
        </div>

        <button class="btn btn-dark w-100" type="submit" [disabled]="loading">
          <span *ngIf="loading">Loading...</span>
          <span *ngIf="!loading">Login</span>
        </button>
      </form>
    </div>
  </section>
</main>
