services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: identityhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "IdentityHub123!"
    ports:
      - "1433:1433"
    volumes:
      - identityhub-sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  userservice:
    build:
      context: .
      dockerfile: src/UserService/IdentityHub.UserService.Api/Dockerfile
    container_name: identityhub-userservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=identityhub_users;User Id=sa;Password=IdentityHub123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      RabbitMQ__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      Jwt__Key: "IdentityHubDevelopmentJwtKey-ChangeThisInProduction-2026"
      Jwt__Issuer: "IdentityHub.AuthService"
      Jwt__Audience: "IdentityHub"
      InternalServices__ApiKey: "IdentityHub-Internal-Development-Key-2026"
    ports:
      - "5094:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  authservice:
    build:
      context: .
      dockerfile: src/AuthService/IdentityHub.AuthService.Api/Dockerfile
    container_name: identityhub-authservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=identityhub_auth;User Id=sa;Password=IdentityHub123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Services__UserService: "http://userservice:8080"
      Jwt__Key: "IdentityHubDevelopmentJwtKey-ChangeThisInProduction-2026"
      Jwt__Issuer: "IdentityHub.AuthService"
      Jwt__Audience: "IdentityHub"
      RabbitMQ__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      InternalServices__ApiKey: "IdentityHub-Internal-Development-Key-2026"
    ports:
      - "5029:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      userservice:
        condition: service_started
    restart: on-failure

  roleservice:
    build:
      context: .
      dockerfile: src/RoleService/IdentityHub.RoleService.Api/Dockerfile
    container_name: identityhub-roleservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=identityhub_roles;User Id=sa;Password=IdentityHub123!;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Services__UserService: "http://userservice:8080"
      RabbitMQ__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      Jwt__Key: "IdentityHubDevelopmentJwtKey-ChangeThisInProduction-2026"
      Jwt__Issuer: "IdentityHub.AuthService"
      Jwt__Audience: "IdentityHub"
      InternalServices__ApiKey: "IdentityHub-Internal-Development-Key-2026"
    ports:
      - "5070:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      userservice:
        condition: service_started
    restart: on-failure

  auditservice:
    build:
      context: .
      dockerfile: src/AuditService/IdentityHub.AuditService.Api/Dockerfile
    container_name: identityhub-auditservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDB__ConnectionString: "mongodb://mongodb:27017"
      MongoDB__DatabaseName: "identityhub_audit"
      RabbitMQ__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      Jwt__Key: "IdentityHubDevelopmentJwtKey-ChangeThisInProduction-2026"
      Jwt__Issuer: "IdentityHub.AuthService"
      Jwt__Audience: "IdentityHub"
    ports:
      - "5080:8080"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  aiservice:
    build:
      context: .
      dockerfile: src/AIService/IdentityHub.AIService.Api/Dockerfile
    container_name: identityhub-aiservice
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      OpenAI__ApiKey: "${OPENAI_API_KEY:-}"
      OpenAI__Model: "gpt-5.6-luna"
      OpenAI__EmbeddingModel: "text-embedding-3-small"
      Qdrant__Url: "http://qdrant:6333"
      Qdrant__CollectionName: "identityhub_knowledge"
      Jwt__Key: "IdentityHubDevelopmentJwtKey-ChangeThisInProduction-2026"
      Jwt__Issuer: "IdentityHub.AuthService"
      Jwt__Audience: "IdentityHub"
    ports:
      - "5090:8080"
    depends_on:
      qdrant:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: identityhub-frontend
    ports:
      - "4200:80"
    depends_on:
      - authservice
      - userservice
      - roleservice
      - auditservice
      - aiservice
    restart: on-failure

  mongodb:
    image: mongo:7
    container_name: identityhub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - identityhub-mongodb-data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: identityhub-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - identityhub-qdrant-data:/qdrant/storage
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: identityhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - identityhub-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  identityhub-sqlserver-data:
  identityhub-mongodb-data:
  identityhub-rabbitmq-data:
  identityhub-qdrant-data:
